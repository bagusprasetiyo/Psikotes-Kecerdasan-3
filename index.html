<script>
let S=Date.now()%1e9;const R=()=>{S|=0;S=S+0x6D2B79F5|0;let t=Math.imul(S^S>>>15,1|S);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const ri=(a,b)=>a+Math.floor(R()*(b-a+1)),pick=a=>a[ri(0,a.length-1)],shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const L=i=>String.fromCharCode(65+i),isF=s=>typeof s=='string'&&s.startsWith('<svg'),idr=x=>x.toLocaleString('id-ID'),Q=[];
const C=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)};
const FQ=(a,b)=>`<span class="fq"><span class="n">${a}</span><span class="d">${b}</span></span>`,fz=x=>typeof x!='string'||x.startsWith('<svg')?x:x.replace(/(\d+)\/(\d+)/g,(m,a,b)=>FQ(a,b)).replace(/½/g,FQ(1,2));
function add(c,q,right,wrong,e){const o=shuf([right,...wrong]).map(fz);Q.push({c,q:fz(q),o,a:o.indexOf(fz(right)),e:fz(e)})}
const near=(v,s,f=x=>x)=>{const t=new Set([v]);let k=0;while(t.size<5){k++;[1,-1].forEach(m=>{const x=v+m*s*k;if(x>0&&t.size<5)t.add(x)})}return[...t].slice(1).map(f)};
function row(it,lb,w=54,g=34){const n=it.length,W=n*(w+g)-g+10;let s=`<div class="sc"><svg viewBox="0 0 ${W} 80" style="min-width:${Math.min(W,700)}px">`;
it.forEach((t,i)=>{const x=5+i*(w+g),h=i==n-1;s+=`<rect x="${x}" y="18" width="${w}" height="44" rx="8" class="bx${h?' hl':''}"/><foreignObject x="${x}" y="18" width="${w}" height="44"><div class="ft${h?' wh2':''}">${t}</div></foreignObject>`;
if(i<n-1)s+=`<path d="M${x+w+4} 40h${g-12}m-5-4l5 4l-5 4" class="ar"/><text x="${x+w+g/2}" y="30" text-anchor="middle" class="lb">${lb[i]||''}</text>`});return s+'</svg></div>'}
/* ===== 1. ANALOGI VERBAL (10) ===== */
[['Hakim','Palu','Dirigen','Tongkat','Piano|Orkestra|Not balok|Panggung','Palu adalah alat khas profesi hakim; tongkat (baton) adalah alat khas dirigen. Piano dan orkestra bukan alat pribadi dirigen.'],
['Hemat','Boros','Tekun','Malas','Rajin|Ulet|Gigih|Giat','Hubungan <b>antonim</b>. Lawan kata tekun adalah malas; keempat pilihan lain justru bersinonim dengan tekun.'],
['Termometer','Suhu','Anemometer','Kecepatan angin','Arah mata angin|Curah hujan|Tekanan udara|Cuaca','Alat ukur dan besaran yang diukurnya. Anemometer mengukur kecepatan angin (arah angin diukur dengan wind vane, tekanan udara dengan barometer).'],
['Berudu','Katak','Ulat','Kupu-kupu','Kepompong|Belalang|Lebah|Telur','Tahap muda → bentuk dewasa (akhir metamorfosis). Kepompong hanyalah tahap tengah, bukan bentuk akhir.'],
['Prolog','Epilog','Pembukaan','Penutup','Pendahuluan|Isi|Judul|Daftar isi','Hubungan <b>antonim posisional</b>: bagian awal lawan bagian akhir.'],
['Bendungan','Banjir','Vaksin','Wabah','Dokter|Suntikan|Obat|Kuman','Hubungan <b>fungsi pencegahan</b>: bendungan mencegah banjir, vaksin mencegah wabah penyakit. Obat berfungsi menyembuhkan, bukan mencegah.'],
['Draf','Naskah','Tunas','Pohon','Akar|Daun|Hutan|Bunga','Hubungan <b>tahap awal → hasil akhir</b>: draf disempurnakan menjadi naskah, tunas tumbuh menjadi pohon.'],
['Hepatitis','Hati','Nefritis','Ginjal','Lambung|Paru-paru|Jantung|Otak','Akhiran <i>-itis</i> berarti peradangan. Hepatitis = radang hati, nefritis = radang ginjal.'],
['Dokter bedah','Skalpel','Pematung','Pahat','Batu|Patung|Galeri|Seniman','Hubungan <b>profesi – alat utama</b>. Batu dan patung adalah bahan/hasil, bukan alat.'],
['Rekonsiliasi','Konflik','Restorasi','Kerusakan','Bangunan|Pemugaran|Sejarah|Cagar budaya','Hubungan <b>tujuan penyelesaian</b>: rekonsiliasi mengakhiri konflik, restorasi memperbaiki kerusakan.']
].forEach(([a,b,c,r,w,e])=>add('Analogi Verbal',`Tentukan padanan hubungan kata berikut:<br><b>${a} : ${b} = ${c} : …</b>`,r,w.split('|'),row([a,b,c,r],['berelasi','≙','berelasi'],120,44)+`<p>${e}</p><p>Jawaban: <b>${r}</b></p>`));
/* ===== 2. LOGIKA (12) ===== */
[['Semua penulis adalah pembaca.<br>Sebagian pembaca adalah pemusik.','Tidak dapat ditarik kesimpulan pasti tentang penulis dan pemusik','Sebagian penulis adalah pemusik|Semua pemusik adalah penulis|Sebagian pemusik bukan pembaca|Tidak ada penulis yang pemusik','Himpunan penulis berada di dalam pembaca, tetapi “sebagian pembaca yang pemusik” bisa saja berada di luar irisan penulis. Jadi hubungan penulis–pemusik tidak pasti.',['Penulis','Pembaca','Pemusik'],['⊂ semua','∩ sebagian']],
['Tidak ada mahasiswa yang malas.<br>Sebagian orang malas adalah atlet.','Sebagian atlet bukan mahasiswa','Semua atlet adalah mahasiswa|Sebagian atlet adalah mahasiswa|Tidak ada atlet yang malas|Semua mahasiswa adalah atlet','Atlet yang malas pasti bukan mahasiswa (mahasiswa tidak ada yang malas). Karena ada atlet yang malas, maka sebagian atlet bukan mahasiswa.',['Mahasiswa','Orang malas','Atlet'],['saling lepas','∩ sebagian']],
['Jika hujan deras maka jalan banjir.<br>Jika jalan banjir maka lalu lintas macet.<br>Hari ini lalu lintas tidak macet.','Hari ini tidak hujan deras','Jalan banjir tetapi hujan tidak deras|Hujan deras tetapi jalan tidak banjir|Hari ini hujan deras|Hari ini jalan banjir','Gunakan kontraposisi berantai: tidak macet ⇒ tidak banjir ⇒ tidak hujan deras.',['Tidak macet','Tidak banjir','Tidak hujan deras'],['kontraposisi','kontraposisi']],
['Semua anggota tim juara berlatih setiap hari.<br>Sebagian anggota klub tidak berlatih setiap hari.','Sebagian anggota klub bukan anggota tim juara','Semua anggota klub adalah tim juara|Sebagian anggota tim juara bukan anggota klub|Tidak ada anggota klub yang berlatih|Semua anggota klub tidak berlatih setiap hari','Anggota tim juara pasti berlatih tiap hari. Anggota klub yang tidak berlatih tiap hari pasti bukan anggota tim juara.',['Klub (sebagian)','Tidak berlatih','Bukan tim juara'],['→','kontraposisi']],
['Beberapa pejabat jujur.<br>Semua yang jujur dipercaya rakyat.<br>Tidak ada yang dipercaya rakyat yang korup.','Beberapa pejabat tidak korup','Semua pejabat jujur|Beberapa pejabat korup|Semua pejabat dipercaya rakyat|Tidak ada pejabat yang jujur','Pejabat jujur ⇒ dipercaya rakyat ⇒ tidak korup. Karena ada pejabat yang jujur, ada pejabat yang tidak korup.',['Pejabat (sebagian)','Jujur','Dipercaya','Tidak korup'],['⊂','⊂','⇒']],
['Jika Dina belajar maka ia lulus.<br>Jika Dina lulus maka ia mendapat beasiswa.<br>Dina tidak mendapat beasiswa.','Dina tidak belajar dan tidak lulus','Dina belajar tetapi tidak lulus|Dina lulus tetapi tidak belajar|Dina belajar|Dina lulus','Rantai: belajar → lulus → beasiswa. Kontraposisinya: tidak beasiswa → tidak lulus → tidak belajar.',['Tidak beasiswa','Tidak lulus','Tidak belajar'],['kontraposisi','kontraposisi']],
['Semua A adalah B.<br>Tidak ada B yang C.<br>Sebagian D adalah C.','Sebagian D bukan A','Semua D adalah A|Sebagian D adalah A|Tidak ada D yang B|Semua C adalah D','A ⊂ B dan B tidak beririsan dengan C, maka A tidak beririsan dengan C. D yang C pasti bukan A.',['A ⊂ B','B ∩ C = ∅','D ∩ C ≠ ∅','Sebagian D bukan A'],['+','+','⇒']],
['Pernyataan: “Jika harga BBM naik maka harga sembako naik.”<br>Pernyataan yang <b>ekuivalen</b> dengan pernyataan tersebut adalah …','Jika harga sembako tidak naik maka harga BBM tidak naik','Jika harga sembako naik maka harga BBM naik|Jika harga BBM tidak naik maka harga sembako tidak naik|Harga BBM naik dan harga sembako tidak naik|Harga BBM tidak naik atau harga sembako tidak naik','p → q ekuivalen dengan ~q → ~p (kontraposisi). Konvers dan invers tidak ekuivalen.',['p → q','~q → ~p'],['ekuivalen']]
